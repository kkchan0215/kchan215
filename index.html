<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>귀여운 택시미터</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f7efe3;
  font-family: 'Jua', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #222;
}

.container {
  width: min(430px, 100%);
}

.card {
  background: #fff;
  border-radius: 30px;
  padding: 25px;
  box-shadow: 0 12px 35px rgba(0,0,0,.12);
}

.title {
  text-align: center;
  font-size: 30px;
  margin-bottom: 20px;
}

.meter {
  background: #171717;
  color: #fff;
  border-radius: 25px;
  padding: 25px;
  text-align: center;
}

.label {
  font-size: 18px;
  color: #aaa;
}

.money {
  font-size: 55px;
  margin: 8px 0;
  letter-spacing: 2px;
}

.won {
  font-size: 22px;
  color: #ddd;
}

.status {
  margin-top: 15px;
  font-size: 16px;
  color: #aaa;
}

.speedBox {
  margin-top: 20px;
  background: #222;
  border-radius: 25px;
  padding: 22px;
  text-align: center;
}

.speedTitle {
  font-size: 18px;
  color: #aaa;
  margin-bottom: 5px;
}

.speed {
  font-size: 72px;
  line-height: 1;
  color: #fff;
}

.unit {
  font-size: 22px;
  color: #bbb;
  margin-top: 8px;
}

.road {
  height: 10px;
  background: #444;
  border-radius: 10px;
  margin: 18px 0 5px;
  overflow: hidden;
}

.roadBar {
  height: 100%;
  width: 0%;
  background: #fff;
  border-radius: 10px;
  transition: width .4s linear;
}

.voice {
  margin-top: 20px;
  background: #f2f2f2;
  border-radius: 20px;
  padding: 16px;
  text-align: center;
}

.voiceText {
  font-size: 17px;
  min-height: 25px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 18px;
  padding: 15px;
  margin-top: 12px;
  font-family: inherit;
  font-size: 19px;
  cursor: pointer;
  background: #222;
  color: white;
}

button:active {
  transform: scale(.98);
}

.small {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="title">🚕 귀여운 택시미터</div>

    <div class="meter">
      <div class="label">현재 요금</div>
      <div class="money" id="money">0.00</div>
      <div class="won">원</div>
      <div class="status" id="taxiStatus">대기 중</div>
    </div>

    <div class="speedBox">
      <div class="speedTitle">🚗 가상 속도계</div>

      <div class="speed" id="speed">0</div>
      <div class="unit">km/h</div>

      <div class="road">
        <div class="roadBar" id="roadBar"></div>
      </div>
    </div>

    <div class="voice">
      <div class="voiceText" id="voiceText">
        🎙️ 음성인식 대기 중
      </div>

      <button onclick="startVoice()">
        🎙️ 음성인식 시작
      </button>
    </div>

    <button onclick="startTaxi()">
      🚕 택시미터 시작
    </button>

    <button onclick="stopTaxi()">
      ⏹️ 택시미터 정지
    </button>

    <div class="small">
      ※ 속도계는 재미를 위한 가상 속도계입니다.
    </div>

  </div>
</div>


<script>
/* =========================
   택시미터
========================= */

let money = 0;
let taxiRunning = false;
let taxiTimer = null;

function startTaxi() {
  if (taxiRunning) return;

  taxiRunning = true;
  document.getElementById("taxiStatus").textContent = "운행 중 🚕";

  taxiTimer = setInterval(() => {
    // 1초마다 0.04원 증가
    money += 0.04;

    document.getElementById("money").textContent =
      money.toFixed(2);
  }, 1000);
}
