<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚕 택시미터</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f5ecdf;
  font-family: 'Jua', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 30px;
  padding: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.title {
  text-align: center;
  font-size: 30px;
  margin-bottom: 18px;
}

.meter {
  background: #171717;
  color: white;
  border-radius: 25px;
  padding: 25px;
  text-align: center;
}

.meterTitle {
  color: #aaa;
  font-size: 17px;
}

.money {
  font-size: 52px;
  margin: 5px 0;
}

.status {
  color: #aaa;
}

.speedBox {
  margin-top: 18px;
  background: #202020;
  color: white;
  border-radius: 25px;
  padding: 22px;
  text-align: center;
}

.speedTitle {
  color: #aaa;
  font-size: 18px;
}

.speed {
  font-size: 75px;
  line-height: 1;
  margin: 8px 0;
}

.unit {
  color: #bbb;
  font-size: 20px;
}

.bar {
  width: 100%;
  height: 10px;
  background: #444;
  border-radius: 20px;
  margin-top: 18px;
  overflow: hidden;
}

.barFill {
  height: 100%;
  width: 0%;
  background: white;
  transition: width .2s linear;
}

.voiceBox {
  margin-top: 18px;
  background: #f1f1f1;
  border-radius: 20px;
  padding: 17px;
  text-align: center;
}

.voiceStatus {
  min-height: 26px;
  font-size: 16px;
  color: #555;
}

button {
  width: 100%;
  border: none;
  border-radius: 18px;
  padding: 15px;
  margin-top: 11px;
  font-family: inherit;
  font-size: 18px;
  background: #222;
  color: white;
}

button:active {
  transform: scale(.97);
}

.test {
  background: #777;
}

.stop {
  background: #555;
}

.note {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 14px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="card">

  <div class="title">🚕 택시미터</div>

  <div class="meter">
    <div class="meterTitle">현재 요금</div>

    <div class="money">
      <span id="money">0.00</span>원
    </div>

    <div class="status" id="taxiStatus">
      대기 중
    </div>
  </div>


  <div class="speedBox">

    <div class="speedTitle">
      🚗 가상 속도계
    </div>

    <div class="speed" id="speed">
      0
    </div>

    <div class="unit">
      km/h
    </div>

    <div class="bar">
      <div class="barFill" id="barFill"></div>
    </div>

  </div>


  <div class="voiceBox">

    <div class="voiceStatus" id="voiceStatus">
      🎙️ 마이크 대기 중
    </div>

    <button onclick="requestMicrophone()">
      🎙️ 마이크 권한 허용 & 음성인식 시작
    </button>

  </div>


  <button onclick="startMeter()">
    🚕 택시미터 시작
  </button>

  <button onclick="stopMeter()" class="stop">
    ⏹️ 택시미터 정지
  </button>

  <button onclick="testHighway()" class="test">
    🧪 속도계 테스트
  </button>

  <button onclick="stopDriving()" class="stop">
    🛑 속도계 정지
  </button>


  <div class="note">
    "이제 고속도로 갑니다"라고 말하면<br>
    0 → 120km/h → 1분 유지 → 20~80km/h 반복
  </div>

</div>


<script>

/* ==================================
   택시미터
================================== */

let money = 0;
let meterTimer = null;
let meterRunning = false;

function startMeter() {

  if (meterRunning) return;

  meterRunning = true;

  document.getElementById("taxiStatus").textContent =
    "운행 중 🚕";

  meterTimer = setInterval(function () {

    money += 0.04;

    document.getElementById("money").textContent =
      money.toFixed(2);

  }, 1000);
}


function stopMeter() {

  meterRunning = false;

  clearInterval(meterTimer);

  document.getElementById("taxiStatus").textContent =
    "정지";
}


/* ==================================
   속도계
================================== */

let speed = 0;

let speedTimer = null;

let driving = false;


/* 속도 표시 */

function setSpeed(value) {

  speed = Math.round(value);

  document.getElementById("speed").textContent =
    speed;

  document.getElementById("barFill").style.width =
    (speed / 120 * 100) + "%";
}


/* ==================================
   마이크 권한
================================== */

async function requestMicrophone() {

  const status =
    document.getElementById("voiceStatus");

  status.textContent =
    "🎙️ 마이크 권한 요청 중...";

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    stream.getTracks().forEach(function(track) {
      track.stop();
    });

    status.textContent =
      "🎙️ 듣고 있어요...";

    startSpeechRecognition();

  } catch (error) {

    status.textContent =
      "❌ 마이크 권한을 허용해주세요.";

  }
}


/* ==================================
   음성인식
================================== */

let recognition = null;

function startSpeechRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    document.getElementById("voiceStatus").textContent =
      "⚠️ 이 브라우저에서는 음성인식을 사용할 수 없습니다.";

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "ko-KR";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;


  recognition.onstart = function() {

    document.getElementById("voiceStatus").textContent =
      "🎙️ 듣는 중 — '이제 고속도로 갑니다'";

  };


  recognition.onresult = function(event) {

    let text = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      text +=
        event.results[i][0].transcript;

    }

    document.getElementById("voiceStatus").textContent =
      "🗣️ " + text;


    let clean =
      text.replace(/\s/g, "");


    if (
      clean.includes("이제고속도로갑니다") &&
      !driving
    ) {

      startHighway();

    }

  };


  recognition.onerror = function() {

    document.getElementById("voiceStatus").textContent =
      "🎙️ 음성인식 오류";

  };


  try {

    recognition.start();

  } catch(e) {}

}


/* ==================================
   고속도로 가속
================================== */

function startHighway() {

  if (driving) return;

  driving = true;

  clearInterval(speedTimer);

  speed = 0;

  document.getElementById("voiceStatus").textContent =
    "🛣️ 고속도로 진입! 가속 중 🚗💨";


  speedTimer =
    setInterval(function() {

      speed += 2;

      setSpeed(speed);


      if (speed >= 120) {

        speed = 120;

        setSpeed(120);

        clearInterval(speedTimer);

        document.getElementById("voiceStatus").textContent =
          "🛣️ 120km/h로 주행 중";


        /*
          120km/h에서 정확히 1분 유지
        */

        setTimeout(function() {

          startCruising();

        }, 60000);

      }

    }, 500);
}


/* ==================================
   ⭐ 핵심 ⭐
   20 → 80 → 20 반복
================================== */

function startCruising() {

  document.getElementById("voiceStatus").textContent =
    "🛣️ 고속도로 주행 중 · 속도 변화";


  clearInterval(speedTimer);


  /*
    속도 배열

    20
    30
    40
    50
    60
    70
    80
    70
    60
    50
    40
    30
    다시 20
  */

  const speeds = [
    20,
    30,
    40,
    50,
    60,
    70,
    80,
    70,
    60,
    50,
    40,
    30
  ];


  let index = 0;


  /*
    바로 20부터 시작
  */

  setSpeed(20);


  /*
    1초마다 다음 속도로 이동
  */

  speedTimer =
    setInterval(function() {

      index++;

      /*
        배열 끝나면 다시 처음으로
      */

      if (index >= speeds.length) {
        index = 0;
      }


      let nextSpeed =
        speeds[index];


      setSpeed(nextSpeed);


      /*
        상태 표시
      */

      document.getElementById("voiceStatus").textContent =
        "🛣️ 주행 중 · " +
        nextSpeed +
        " km/h";


    }, 1000);
}


/* ==================================
   테스트
================================== */

function testHighway() {

  if (driving) return;

  startHighway();

}


/* ==================================
   속도계 정지
================================== */

function stopDriving() {

  clearInterval(speedTimer);

  driving = false;

  setSpeed(0);

  document.getElementById("voiceStatus").textContent =
    "🎙️ 다시 대기 중";

}


/* ==================================
   초기화
================================== */

setSpeed(0);

</script>

</body>
</html>
